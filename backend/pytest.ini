[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Coverage settings — measured baseline is 60.93%, with a 60% blocking floor
addopts =
    --verbose
    --cov=src
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=60

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
