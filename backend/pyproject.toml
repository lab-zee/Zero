[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "alembic/versions",
    "chroma_db",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"src/crud/custom_agents.py" = ["E712"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
