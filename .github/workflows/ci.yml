name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        working-directory: backend
        run: ruff check src tests scripts crews/examples/*/tools
      - name: Ruff format
        working-directory: backend
        run: >-
          ruff format --check
          src/agent_paths.py
          src/agents/crew_manifest.py
          src/agents/crew_validator.py
          scripts/*.py
          tests/test_crew_manifest.py
          tests/test_crew_validator.py
          tests/test_crew_quality.py
          tests/test_demo_scripts.py
          crews/examples/*/tools/*.py

  backend-tests:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests with enforced coverage
        working-directory: backend
        env:
          TESTING: "1"
          OPENAI_API_KEY: test_key_for_testing
          GEMINI_API_KEY: test_key_for_testing
        run: python -m pytest
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  crew-validation:
    name: Validate bundled crews and plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Validate default and bundled crews
        working-directory: backend
        run: python scripts/validate_all_crews.py

  frontend-quality:
    name: Frontend lint, format, types, and dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier
        working-directory: frontend
        run: npm run format:check
      - name: Knip
        working-directory: frontend
        run: npm run knip
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

  frontend-tests:
    name: Frontend tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests with enforced coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  shellcheck:
    name: ShellCheck demo scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check demo scripts
        run: shellcheck scripts/demo.sh scripts/load-crew.sh

  build:
    name: Frontend production build
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - backend-tests
      - crew-validation
      - frontend-quality
      - frontend-tests
      - shellcheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7
